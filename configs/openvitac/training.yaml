_target_: adavip.openvitac.workspace.OpenViTacWorkspace
output_dir: /data/wangzihao/outputs/openvitac/stage0
resume: null
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.00008
  betas: [0.95, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-06
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 1
  timeout: 180
val_dataloader:
  batch_size: 8
  num_workers: 2
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 1
  timeout: 180
training:
  device: cuda:0
  seed: 42
  validation_seed: 20261101
  num_epochs: 500
  use_ema: true
  lr_warmup_steps: 500
  gradient_clip_norm: 1.0
  checkpoint_every: 100
  checkpoint_epochs: [50, 100, 200, 300, 400, 500]
  checkpoint_every_steps: 1000
  checkpoint_first_step: 1
  log_every_steps: 20
  max_train_steps: null
  max_val_steps: null
runtime:
  stop_after_steps: 0
  stop_after_epochs: 0
  allow_epoch_extension: false
  preflight_windows: 0

# Inference architecture from the frozen Teacher E500 used by jobs 387293/387295.
# Stage2 checkpoint tensors select the Transformer or MLP class.
shape_meta:
  obs:
    front:
      shape:
      - 3
      - 256
      - 256
      type: rgb
    side:
      shape:
      - 3
      - 256
      - 256
      type: rgb
    wrist:
      shape:
      - 3
      - 256
      - 256
      type: rgb
    left_tactile_camera_taxim:
      shape:
      - 3
      - 320
      - 240
      type: rgb
    right_tactile_camera_taxim:
      shape:
      - 3
      - 320
      - 240
      type: rgb
    state:
      shape:
      - 7
      type: low_dim
    task_embedding:
      shape:
      - 512
      type: low_dim
  action:
    shape:
    - 7
n_obs_steps: 2
n_action_steps: 8
task_embedding_path: null
policy:
  _target_: adavip.manifeel.reference_diffusion_policy.FullSensorReferencePolicy
  obs_encoder:
    _target_: adavip.manifeel.full_sensor_obs_encoder.FullSensorObsEncoder
    shape_meta:
      obs:
        front:
          shape:
          - 3
          - 256
          - 256
          type: rgb
        side:
          shape:
          - 3
          - 256
          - 256
          type: rgb
        wrist:
          shape:
          - 3
          - 256
          - 256
          type: rgb
        left_tactile_camera_taxim:
          shape:
          - 3
          - 320
          - 240
          type: rgb
        right_tactile_camera_taxim:
          shape:
          - 3
          - 320
          - 240
          type: rgb
        state:
          shape:
          - 7
          type: low_dim
        task_embedding:
          shape:
          - 512
          type: low_dim
      action:
        shape:
        - 7
    n_obs_steps: 2
    token_dim: 256
    image_feature_dim: 512
    use_group_norm: true
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: 16
  n_obs_steps: 2
  n_action_steps: 8
  num_inference_steps: 100
  full_input_probability: 0.8
  mask_weights:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

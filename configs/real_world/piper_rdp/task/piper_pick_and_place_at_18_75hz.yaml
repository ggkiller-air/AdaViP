name: piper_pick_and_place_at_18_75hz
dataset_path: ${oc.env:ADAVIP_RDP_DATASET,./datasets/piper_rdp}
shape_meta: &shape_meta
  obs:
    right_robot_qpos:
      shape: [7]
      type: low_dim
    right_gelsight_marker_offset_emb:
      shape: [15]
      type: low_dim
  extended_obs:
    right_gelsight_marker_offset_emb:
      shape: [15]
      type: low_dim
  action:
    shape: [7]

dataset:
  _target_: adavip.real_world.piper_rdp_dataset.PiperRdpDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: ${training.seed}
  val_ratio: 0.0
  max_train_episodes: null

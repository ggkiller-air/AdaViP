horizon: 29
n_obs_steps: 2
dataset_obs_temporal_downsample_ratio: 2

policy:
  horizon: ${horizon}
  n_latent_dims: 8
  mlp_layer_num: 1
  use_conv_encoder: true
  conv_latent_dims: 64
  conv_layer_num: 1
  use_rnn_decoder: true
  rnn_latent_dims: 64
  rnn_layer_num: 1
  kl_multiplier: 1.0e-6
  n_embed: 8
  use_vq: false
  vqvae_groups: 4
  eval: false
  act_scale: 1.0
